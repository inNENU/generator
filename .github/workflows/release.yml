name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^24.20.0

      - name: Install dependencies
        run: pnpm ci

      - name: Build package
        run: pnpm run build

      - name: Publish to npm
        run: |
          pnpm publish --provenance --no-git-checks
